name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: mvn -B clean package

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: BossBarMessages
          path: target/BossBarMessages-*.jar
          if-no-files-found: error

      # Pushing a tag like v1.0 publishes a GitHub release with the jar attached
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: target/BossBarMessages-*.jar
          generate_release_notes: true
